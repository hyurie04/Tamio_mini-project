<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pastel Cute Button</title>

<!-- Playful font -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    /* Pastel theme tokens */
    --btn-font: "Baloo 2", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
    --btn-text: #4c4452;                 /* soft cocoa text */
    --btn-bg:   #ffdff1;                 /* cotton candy pink */
    --btn-bg-2: #d9f2ff;                 /* sky pastel */
    --btn-hover: #ffcae9;                /* deeper pink hover */
    --btn-border: #ffffff;
    --ring: 0 0 0 6px rgba(255, 202, 233, 0.55);

    /* Size scales using clamp for mobile friendliness */
    --btn-fs: clamp(0.95rem, 2vw + 0.3rem, 1.1rem);
    --btn-py: clamp(0.6rem, 1.6vw, 0.9rem);
    --btn-px: clamp(1rem, 3.2vw, 1.4rem);
    --btn-radius: 999px;                 /* pill shape */
  }

  body{
    font-family: var(--btn-font);
    background: linear-gradient(135deg, #fff6fb 0%, #ecfbff 100%);
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 20px;
  }

  .cute-btn{
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.5em;
    font: 700 var(--btn-fs)/1 var(--btn-font);
    color: var(--btn-text);
    background: radial-gradient(120% 160% at 0% 0%, var(--btn-bg), #fff 60%) border-box;
    padding: var(--btn-py) var(--btn-px);
    border: 2px solid var(--btn-border);
    border-radius: var(--btn-radius);
    box-shadow:
      0 8px 0 #e9b6cc,                   /* “jelly” shadow */
      0 14px 24px rgba(0,0,0,0.08);
    text-decoration: none;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition:
      transform .15s ease,
      box-shadow .2s ease,
      background-color .2s ease,
      filter .2s ease;
  }

  /* Cute emoji/icon bubble */
  .cute-btn .bubble{
    display: inline-grid;
    place-items: center;
    width: 1.9em;
    height: 1.9em;
    background: #fff;
    border: 2px solid var(--btn-border);
    border-radius: 50%;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6);
  }

  /* Fun hover: bounce a bit + soft glow + sparkle sweep */
  .cute-btn::after{
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: conic-gradient(from 180deg at 50% 50%, transparent 0 60%, rgba(255,255,255,0.45) 61% 70%, transparent 71% 100%);
    transform: translateX(-120%);
    mix-blend-mode: screen;
    pointer-events: none;
    transition: transform .6s cubic-bezier(.22,1,.36,1);
  }

  .cute-btn:hover{
    transform: translateY(-2px) scale(1.02);
    box-shadow:
      0 10px 0 #e0a3c1,
      0 16px 28px rgba(255, 170, 210, 0.35);
    filter: saturate(1.05);
  }

  .cute-btn:hover::after{
    transform: translateX(120%); /* sparkle sweep */
  }

  .cute-btn:active{
    transform: translateY(2px) scale(0.98);
    box-shadow:
      0 5px 0 #e0a3c1,
      0 8px 16px rgba(0,0,0,0.12);
  }

  .cute-btn:focus-visible{
    outline: none;
    box-shadow:
      0 8px 0 #e0a3c1,
      0 14px 24px rgba(0,0,0,0.08),
      var(--ring);
  }

  /* Variant: sky pastel */
  .cute-btn.sky{
    --btn-bg: var(--btn-bg-2);
    --btn-hover: #bfe8ff;
    box-shadow:
      0 8px 0 #a6d3e6,
      0 14px 24px rgba(0,0,0,0.08);
  }
  .cute-btn.sky:hover{
    box-shadow:
      0 10px 0 #8ec2d9,
      0 16px 28px rgba(166, 211, 230, 0.45);
  }
  .cute-btn.sky:active{
    box-shadow:
      0 5px 0 #8ec2d9,
      0 8px 16px rgba(0,0,0,0.12);
  }

  /* Motion preference */
  @media (prefers-reduced-motion: reduce){
    .cute-btn,
    .cute-btn::after{ transition: none; }
    .cute-btn:hover{ transform: none; }
  }
</style>
</head>
<body>

  <!-- Pink pastel -->
  <button class="cute-btn">
    <span class="bubble">✨</span>
    Fun Fact
  </button>

  <!-- Sky pastel (example variant) -->
  <!--
  <button class="cute-btn sky">
    <span class="bubble">🌸</span>
    Click Me
  </button>
  -->

</body>
</html>
